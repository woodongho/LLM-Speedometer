[package]
name = "llm-speedometer"
version = "0.1.0"
description = "Benchmark and visualize the speed of local LLMs via an OpenAI-compatible streaming API."
authors = []
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# by default Tauri runs in production mode; `custom-protocol` is required for dev
custom-protocol = ["tauri/custom-protocol"]
